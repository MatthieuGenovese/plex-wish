quarkus.application.name=anime-server
quarkus.http.port=8080

# En dev, Quarkus n'écoute que sur localhost par défaut : on écoute sur toutes
# les interfaces pour que le téléphone (même Wi-Fi) puisse joindre le PC.
%dev.quarkus.http.host=0.0.0.0

# --- Base de données ---------------------------------------------------------
# En dev et en test, pas d'URL : Quarkus Dev Services démarre un PostgreSQL
# jetable dans Docker (Docker Desktop doit être lancé).
# En prod (conteneur), tout vient des variables d'environnement.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB}
%prod.quarkus.datasource.username=${POSTGRES_USER}
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}

# Le schéma est géré uniquement par Flyway (src/main/resources/db/migration).
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.hibernate-orm.database.generation=validate

# --- Authentification (ARCHITECTURE §5) ------------------------------------------
# Secrets : obligatoires en prod (>= 32 caractères, différents), le démarrage échoue sinon.
# En dev/test, des valeurs de développement sont fournies (jamais utilisées en prod).
anime.auth.jwt-secret=${JWT_SECRET:}
anime.auth.stream-signing-secret=${STREAM_SIGNING_SECRET:}
%dev.anime.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-0123456789abcdef}
%dev.anime.auth.stream-signing-secret=${STREAM_SIGNING_SECRET:dev-only-stream-secret-0123456789ab}
%test.anime.auth.jwt-secret=test-only-jwt-secret-0123456789abcdef
%test.anime.auth.stream-signing-secret=test-only-stream-secret-0123456789ab
# Origine publique (ex. https://anime.mondomaine) : contrôle du header Origin.
anime.auth.public-url=${PUBLIC_URL:}
%dev.anime.auth.public-url=${PUBLIC_URL:http://localhost:4200}
%test.anime.auth.public-url=https://anime.test
# Cookie de session « Secure » : toujours en prod (refus de démarrer sinon). Désactivable en dev uniquement,
# pour ng serve en http://localhost:4200. En Docker, http://localhost:8080 fonctionne quand même : les
# navigateurs acceptent les cookies Secure sur localhost.
anime.auth.cookie-secure=true
%dev.anime.auth.cookie-secure=${COOKIE_SECURE:false}
anime.auth.refresh-reuse-grace-seconds=${REFRESH_REUSE_GRACE_SECONDS:20}
anime.auth.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
anime.auth.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
%dev.anime.auth.initial-admin.username=${INITIAL_ADMIN_USERNAME:admin}
%dev.anime.auth.initial-admin.password=${INITIAL_ADMIN_PASSWORD:admin-dev-password}
%test.anime.auth.initial-admin.username=admin
%test.anime.auth.initial-admin.password=admin-test-password

# JWT HS256 : clé construite à partir de auth.jwt-secret (voir auth/JwtKeys.java).

# Vraie IP du client : on ne lit X-Forwarded-For que s'il vient d'un proxy de confiance
# (nginx, dans le réseau Docker interne). En dev, pas de proxy : désactivé.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true
%prod.quarkus.http.proxy.trusted-proxies=${BACKEND_TRUSTED_PROXIES:172.30.64.0/24}
# En test : les requêtes viennent de 127.0.0.1, qui joue le rôle de nginx.
%test.quarkus.http.proxy.proxy-address-forwarding=true
%test.quarkus.http.proxy.allow-x-forwarded=true
%test.quarkus.http.proxy.trusted-proxies=127.0.0.1

# --- Logs : jamais de mot de passe, token ni hash (ARCHITECTURE §11) --------------
# Même si quelqu'un passe les logs en DEBUG, Hibernate ne doit afficher ni le contenu des
# entités (hash de mot de passe, hash de refresh token) ni les valeurs des paramètres SQL.
quarkus.log.category."org.hibernate.internal.util.EntityPrinter".level=INFO
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=INFO
quarkus.log.category."org.hibernate.type.descriptor".level=INFO

# --- OpenAPI / Swagger ---------------------------------------------------------
# Swagger UI inclus dans le build, mais servi seulement si SWAGGER_ENABLED=true
# (toujours actif en dev).
quarkus.smallrye-openapi.info-title=Anime Server API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.enable=${SWAGGER_ENABLED:false}
quarkus.swagger-ui.enable=${SWAGGER_ENABLED:false}
%dev.quarkus.smallrye-openapi.enable=true
%dev.quarkus.swagger-ui.enable=true

# --- CORS ------------------------------------------------------------------------
# En prod, front et API partagent la même origine (nginx) : pas de CORS.
# Le filtre CORS refuse toute origine qui n'est pas listée ici.
# PUBLIC_URL doit y figurer : derrière nginx, le backend reçoit la requête en http alors que
# le navigateur annonce Origin: https://..., ce que Quarkus traiterait sinon comme une autre origine.
# CORS_ORIGINS (liste séparée par des virgules) sert uniquement au dev.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${anime.auth.public-url:},${CORS_ORIGINS:}

# --- Bibliothèque (ARCHITECTURE §7) ----------------------------------------------
# Racine des médias : /media dans le conteneur (montée en lecture seule).
anime.library.media-root=${MEDIA_ROOT:/media}
%dev.anime.library.media-root=${MEDIA_ROOT:../dev-media}
%test.anime.library.media-root=target/test-library
anime.library.batch-size=500

# --- Lecture (ARCHITECTURE §6) ---------------------------------------------------------------
# Durée de validité d'une URL de lecture signée (le client en redemande une sur un 403).
anime.auth.stream-url-lifetime=${STREAM_URL_LIFETIME:6h}
# Journal d'accès HTTP (désactivé par défaut) : si on l'active, jamais la query string, qui contient
# la signature des URL de lecture (%R = chemin seul ; %U et %r incluent la query string).
quarkus.http.access-log.pattern=%h %l %u %t "%m %R %H" %s %b
# En DEBUG, ce logger recopie l'URL complète (query string comprise) : bloqué en INFO.
quarkus.log.category."io.quarkus.vertx.http.runtime.ForwardedParser".level=INFO

# --- Métadonnées (ARCHITECTURE §15) -------------------------------------------------------------
# Tâche de fond : récupère affiches, synopsis et année sur AniList, sans jamais bloquer la bibliothèque.
anime.metadata.enabled=${METADATA_ENABLED:true}
# Dans les tests, la tâche est appelée directement, sur un faux serveur AniList.
%test.anime.metadata.enabled=false
%test.anime.metadata.min-interval=0ms

# --- TMDB : synopsis en français (ARCHITECTURE §16) ----------------------------------------------
# Jeton de lecture TMDB (ou ancienne clé v3). Absent : TMDB inactif, synopsis anglais d'AniList.
# Lu uniquement par le backend, jamais renvoyé au client ni journalisé.
anime.tmdb.read-token=${TMDB_READ_TOKEN:}
anime.tmdb.api-key=${TMDB_API_KEY:}
%test.anime.tmdb.worker-enabled=false
%test.anime.tmdb.min-interval=0ms

# --- Affiches sur le NAS (étape 6.2, ARCHITECTURE §17) -------------------------------------
anime.posters.path=${POSTERS_PATH:/data/posters}
anime.posters.enabled=${POSTERS_ENABLED:true}
%dev.anime.posters.path=${POSTERS_PATH:target/dev-posters}
%test.anime.posters.path=target/test-posters
%test.anime.posters.enabled=false
%test.anime.posters.min-interval=0ms

# --- Distribution (étape 6.3, ARCHITECTURE §19) ------------------------------------------
anime.cast.enabled=${CAST_ENABLED:true}
anime.cast.max-roles=${CAST_MAX_ROLES:20}
%test.anime.cast.enabled=false

# --- Traitement média : analyse ffprobe, test à blanc du remux (phase 9, ARCHITECTURE §22) -----------------------------
anime.media.probe-enabled=${MEDIA_PROBE_ENABLED:true}
anime.media.ffprobe-path=${FFPROBE_PATH:ffprobe}
anime.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
anime.media.remux-cache-path=${REMUX_CACHE_PATH:/data/remux-cache}
anime.media.remux-cache-max-gb=${REMUX_CACHE_MAX_GB:50}
%dev.anime.media.remux-cache-path=${REMUX_CACHE_PATH:target/dev-remux-cache}
%test.anime.media.remux-cache-path=target/test-remux-cache
%test.anime.media.remux-cache-reserve-gb=0
%test.anime.media.remux-timeout=3s
%test.anime.media.remux-worker-enabled=false
# Tests : faux ffprobe / ffmpeg (scripts), tâche de fond arrêtée (les tests appellent le service directement).
%test.anime.media.probe-enabled=false
%test.anime.media.ffprobe-path=target/fake-ffprobe.sh
%test.anime.media.ffmpeg-path=target/fake-ffmpeg.sh
%test.anime.media.probe-timeout=2s
%test.anime.media.remux-test-timeout=2s
