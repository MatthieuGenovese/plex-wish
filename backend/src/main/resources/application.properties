quarkus.application.name=anime-server
quarkus.http.port=8080

# En dev, Quarkus n'écoute que sur localhost par défaut : on écoute sur toutes
# les interfaces pour que le téléphone (même Wi-Fi) puisse joindre le PC.
%dev.quarkus.http.host=0.0.0.0

# --- Spike vidéo (phase 0) -------------------------------------------------
# Endpoint /api/dev/* SANS authentification : désactivé par défaut.
spike.stream.enabled=${DEV_SPIKE_STREAM_ENABLED:false}
# Relatif au dossier depuis lequel on lance Quarkus (backend/).
spike.stream.media-dir=${DEV_MEDIA_PATH:../dev-media}

%test.spike.stream.enabled=true
%test.spike.stream.media-dir=target/test-media
