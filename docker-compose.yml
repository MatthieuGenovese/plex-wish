# Anime Server : postgres + backend (Quarkus) + web (nginx + Angular).
# Toute la configuration vient du fichier .env (copier .env.example).
# Seul le service web publie un port sur l'hôte.
# Stack de DÉVELOPPEMENT et d'essai (construite depuis le dépôt). Sur le NAS : deploy/compose.yml (images publiées).

# Journaux Docker : 3 fichiers de 10 Mo au plus par conteneur (sinon ils grossissent sans limite).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anime}
      POSTGRES_USER: ${POSTGRES_USER:-anime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: anime-server-backend
    restart: unless-stopped
    logging: *logging
    # Utilisateur qui a le droit de LIRE le dossier média sur le NAS (voir README).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-anime}
      POSTGRES_USER: ${POSTGRES_USER:-anime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:-}
      STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      REFRESH_REUSE_GRACE_SECONDS: ${REFRESH_REUSE_GRACE_SECONDS:-20}
      STREAM_URL_LIFETIME: ${STREAM_URL_LIFETIME:-6h}
      METADATA_ENABLED: ${METADATA_ENABLED:-true}
      # Synopsis en français (TMDB, facultatif) : lu par le backend uniquement, jamais envoyé au navigateur.
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Affiches téléchargées sur le NAS (dossier du conteneur, monté en écriture ci-dessous).
      POSTERS_PATH: /data/posters
      POSTERS_ENABLED: ${POSTERS_ENABLED:-true}
      # Distribution (personnages et doubleurs, AniList) : images dans <dossier des affiches>/cast.
      CAST_ENABLED: ${CAST_ENABLED:-true}
      CAST_MAX_ROLES: ${CAST_MAX_ROLES:-20}
      MEDIA_PROBE_ENABLED: ${MEDIA_PROBE_ENABLED:-true}
      # Remux à la demande (AVI, OGM → MKV pour Android) : cache monté ci-dessous sur /data/remux-cache.
      REMUX_CACHE_MAX_GB: ${REMUX_CACHE_MAX_GB:-50}
      # Lecteur web (phase 10) : cache monté ci-dessous sur /data/web.
      WEB_CACHE_HOST_PATH: ${WEB_CACHE_PATH:-./web-cache}
      # Le backend ne lit X-Forwarded-For que s'il vient du réseau interne (nginx).
      BACKEND_TRUSTED_PROXIES: ${DOCKER_SUBNET:-172.30.64.0/24}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    volumes:
      # Lecture seule : l'application ne modifie jamais les fichiers média.
      - ${MEDIA_PATH:?MEDIA_PATH manquant dans .env}:/media:ro
      # Affiches : seul dossier où le backend écrit. Distinct de /media. Doit appartenir à PUID:PGID (voir README).
      - ${POSTERS_HOST_PATH:-./posters}:/data/posters
      # Copies remuxées (cache régénérable) : en écriture pour PUID:PGID, distinct de /media.
      - ${REMUX_CACHE_PATH:-./remux-cache}:/data/remux-cache
      # Cache du lecteur web (copies et sous-titres pour le navigateur, régénérable) : en écriture pour PUID:PGID.
      - ${WEB_CACHE_PATH:-./web-cache}:/data/web
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    image: anime-server-web
    restart: unless-stopped
    logging: *logging
    ports:
      # Par défaut, joignable seulement depuis le NAS lui-même (le reverse proxy DSM) : pas d'accès HTTP
      # direct depuis le réseau local. WEB_BIND=0.0.0.0 pour l'ouvrir (essai sans reverse proxy).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    environment:
      # Qui a le droit de fournir X-Forwarded-For à nginx : le reverse proxy DSM.
      # Le DSM, qui tourne sur l'hôte, arrive par la passerelle du réseau Docker (x.x.x.1).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS-172.30.64.1}
      # Pile de développement : la porte du port publié sert tout le site (pas d'assistant, admin initial du .env).
      LAN_ENTRY: local
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:

# Sous-réseau fixe : la passerelle (x.x.x.1), par laquelle arrive le reverse proxy DSM,
# est ainsi connue à l'avance. À changer seulement s'il est déjà utilisé sur la machine.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.64.0/24}
