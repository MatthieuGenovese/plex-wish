# Anime Server : postgres + backend (Quarkus) + web (nginx + Angular).
# Toute la configuration vient du fichier .env (copier .env.example).
# Seul le service web publie un port sur l'hôte.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anime}
      POSTGRES_USER: ${POSTGRES_USER:-anime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: anime-server-backend
    restart: unless-stopped
    # Utilisateur qui a le droit de LIRE le dossier média sur le NAS (voir README).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-anime}
      POSTGRES_USER: ${POSTGRES_USER:-anime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:-}
      STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      REFRESH_REUSE_GRACE_SECONDS: ${REFRESH_REUSE_GRACE_SECONDS:-20}
      STREAM_URL_LIFETIME: ${STREAM_URL_LIFETIME:-6h}
      # Le backend ne lit X-Forwarded-For que s'il vient du réseau interne (nginx).
      BACKEND_TRUSTED_PROXIES: ${DOCKER_SUBNET:-172.30.64.0/24}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    volumes:
      # Lecture seule : l'application ne modifie jamais les fichiers média.
      - ${MEDIA_PATH:?MEDIA_PATH manquant dans .env}:/media:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    image: anime-server-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Qui a le droit de fournir X-Forwarded-For à nginx : le reverse proxy DSM.
      # Le DSM, qui tourne sur l'hôte, arrive par la passerelle du réseau Docker (x.x.x.1).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS-172.30.64.1}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:

# Sous-réseau fixe : la passerelle (x.x.x.1), par laquelle arrive le reverse proxy DSM,
# est ainsi connue à l'avance. À changer seulement s'il est déjà utilisé sur la machine.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.64.0/24}
