# Inclus dans chaque bloc qui pose ses propres add_header
# (nginx n'hérite pas des add_header du niveau parent dans ce cas).
# style-src 'unsafe-inline' : Angular injecte les styles des composants en <style>.
# img-src : affiches locales ('self', /api/posters/…) ; repli distant limité aux deux sources d'affiches.
# media-src blob: : le lecteur web (hls.js) donne à la vidéo une source MediaSource, créée par nos scripts dans la page
# (docs/WEB-PLAYER.md §9, S2, accepté le 2026-10-10). Aucune autre source média distante.
# script-src 'wasm-unsafe-eval' : JASSUB (rendu des sous-titres ASS) compile du WebAssembly servi par le site (S1,
# accepté le 2026-10-10) ; aucun eval JavaScript, aucun script externe. Workers : fichiers du site ('self'), pas de blob:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://s4.anilist.co; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
