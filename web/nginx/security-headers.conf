# Inclus dans chaque bloc qui pose ses propres add_header
# (nginx n'hérite pas des add_header du niveau parent dans ce cas).
# style-src 'unsafe-inline' : Angular injecte les styles des composants en <style>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
